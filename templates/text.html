<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Text Emotion Recognition</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav>

        <h2>Emotion Recognition</h2>

        <div>
            <a href="/">Home</a>
            <a href="/face">Face</a>
            <a href="/speech">Speech</a>
            <a href="/text">Text</a>
        </div>

    </nav>


    <section class="hero">

        <h1>Text Emotion Recognition</h1>

        <h3>Detect Emotion from Text</h3>

        <p>
            Enter a sentence and our LSTM model
            will predict the emotion.
        </p>


        <div class="upload-box">

            <form action="/predict_text"
                  method="POST">

                <textarea
                    name="text"
                    rows="6"
                    cols="60"
                    placeholder="Enter your text here..."
                    required></textarea>

                <br><br>

                <input type="submit"
                       value="Predict Text Emotion"
                       class="button">

            </form>

        </div>

    </section>


    <footer>

        <p>Multimodal Emotion Recognition</p>

        <p>Face • Speech • Text</p>

    </footer>

</body>

</html>
